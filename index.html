<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDaE8Qc2t6xsUPOTht7BjI4NPYGjxxVqQ8",
  authDomain: "for-yatha.firebaseapp.com",
  projectId: "for-yatha",
  storageBucket: "for-yatha.firebasestorage.app",
  messagingSenderId: "345783546547",
  appId: "1:345783546547:web:4fff1f4ad6072b6b4976c6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const counterRef = doc(db, "visitors", "counter");

try {
  await updateDoc(counterRef, {
    count: increment(1)
  });

  onSnapshot(counterRef, (snap) => {
    document.getElementById("count").innerText = snap.data().count;
  });

} catch (e) {
  console.log(e);
}

</script>
